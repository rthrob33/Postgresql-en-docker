services:
  db:
    image: postgres:16
    container_name: postgres-tareas
    restart: unless-stopped
    environment:
      POSTGRES_USER: roberth
      POSTGRES_PASSWORD: roberth123
      POSTGRES_DB: tareas_db
    ports:
      - "5432:5432"
    volumes:
      - datos_postgres:/var/lib/postgresql/data

volumes:
  datos_postgres:
